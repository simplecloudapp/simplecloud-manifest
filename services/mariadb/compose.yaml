services:
  database:
    container_name: "{{networkSlug}}-{{instance}}-database-1"
    image: "{{image}}"
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:{{port}}:3306"
    volumes:
      - data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  data:
