services:
  database:
    image: "{{image}}"
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "exec valkey-server --requirepass \"$${VALKEY_PASSWORD}\""]
    ports:
      - "127.0.0.1:{{port}}:6379"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  data:
