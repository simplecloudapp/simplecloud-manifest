paths:
  - path: "pumpkin.toml"
    type: "TOML"
    data:
      networking.query.address: "0.0.0.0:%port%"
      networking.proxy.enabled: true
      networking.proxy.bungeecord.enabled: true
      networking.java.address: "0.0.0.0:%port%"
      networking.java.encryption: false
      networking.java.online_mode: false
      networking.java.max_players: %max-players%
