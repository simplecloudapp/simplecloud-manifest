      database:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      username:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      password:
        generate: password
        length: 48
        pattern: "^[A-Za-z0-9]+$"
    files:
      - source: services/mongodb/compose.yaml
        target: compose.yaml
      - source: services/mongodb/service.env
        target: .env
        mode: "0600"
      - source: services/mongodb/README.md
        target: README.md
    commands:
      start:
        - ["docker", "compose", "up", "-d", "--wait"]
      stop:
        - ["docker", "compose", "down"]
      status:
        - ["docker", "compose", "ps"]

  redis:
    name: Redis
    description: In-memory data store
    dependencies:
      - installable: docker
        checks:
          - ["docker", "compose", "version"]
          - ["docker", "info"]
