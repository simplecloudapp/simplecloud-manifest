setup:
  components:
    - serverhost
    - default-templates
    - serverhost-defaults

components:
  serverhost:
    type: registry
    slug: serverhost
    name: serverhost
    filename: serverhost.jar
    description: Core runtime for managing Minecraft servers
    startConfig:
      javaArgs: ["-Xmx512m"]

  default-templates:
    type: direct
    version: "0.0.46"
    downloadUrl: "https://github.com/simplecloudapp/simplecloud-manifest/releases/download/v0.0.46/default-templates.zip"
    name: default-templates
    extractPath: "/"

  serverhost-defaults:
    type: direct
    version: "0.0.56"
    downloadUrl: "https://github.com/simplecloudapp/simplecloud-manifest/releases/download/v0.0.56/serverhost-defaults.zip"
    name: serverhost-defaults
    extractPath: "/"

installables:
  docker:
    name: Docker
    description: Docker Engine and the Docker Compose plugin
    variables:
      composeVersion: "5.8.0"
      # For an engine without the Compose plugin: Amazon Linux, a distribution
      # without a Docker repository, or a Docker that was already installed.
      installCompose: >-
        docker compose version >/dev/null 2>&1 && exit 0;
        arch="$(uname -m)";
        case "$arch" in
        x86_64|aarch64) ;;
        armv7l) arch=armv7 ;;
        *) echo "Unsupported Docker Compose architecture: $arch" >&2; exit 1 ;;
        esac;
        name="docker-compose-linux-$arch";
        url="https://github.com/docker/compose/releases/download/v{{composeVersion}}";
        dir="$(mktemp -d)" || exit 1;
        trap 'rm -rf "$dir"' EXIT;
        cd "$dir" || exit 1;
        curl -fsSLO "$url/$name" || exit 1;
        curl -fsSLO "$url/$name.sha256" || exit 1;
        sha256sum -c "$name.sha256" >/dev/null || exit 1;
        install -D -m 0755 "$name" /usr/local/lib/docker/cli-plugins/docker-compose
      # The CLI's docker runner runs docker without sudo, so the user who ran
      # sudo joins the docker group, which is root-equivalent. It applies from
      # their next login.
      addSudoUserToDockerGroup: >-
        if [ -n "${SUDO_USER:-}" ] && [ "$SUDO_USER" != root ]; then
        usermod -aG docker "$SUDO_USER";
        fi
      enableAndStartDocker: >-
        if [ -d /run/systemd/system ]; then
        systemctl enable --now docker;
        else
        service docker start;
        fi
    manualInstructions:
      darwin: "Install and start Docker Desktop from https://docs.docker.com/desktop/setup/install/mac-install/"
      linux: "Install Docker Engine and the Docker Compose plugin from https://docs.docker.com/engine/install/"
      windows: "Install and start Docker Desktop from https://docs.docker.com/desktop/setup/install/windows-install/"
    # apt, dnf and yum install Docker from Docker's repositories, which have
    # current versions, and keep a Docker that is already installed. A Docker
    # repository that is already configured is used as it is, and one written
    # here is removed again when it fails. Where Docker has no repository, apt
    # and Amazon Linux use the distribution's docker package.
    commands:
      apt:
        - ["apt-get", "update"]
        - ["apt-get", "install", "-y", "ca-certificates", "curl"]
        - - "sh"
          - "-c"
          - >-
            command -v docker >/dev/null 2>&1 && exit 0;
            . /etc/os-release;
            case " $ID ${ID_LIKE:-} " in
            *" ubuntu "*) distro=ubuntu; codename="${UBUNTU_CODENAME:-$VERSION_CODENAME}" ;;
            *" debian "*) distro=debian; codename="${DEBIAN_CODENAME:-$VERSION_CODENAME}" ;;
            *) exec apt-get install -y docker.io ;;
            esac;
            repo="https://download.docker.com/linux/$distro";
            arch="$(dpkg --print-architecture)";
            curl -fsI "$repo/dists/$codename/stable/binary-$arch/Packages" >/dev/null 2>&1;
            found=$?;
            if [ "$found" -eq 22 ]; then
            echo "Docker has no repository for $ID $codename on $arch; installing docker.io" >&2;
            exec apt-get install -y docker.io;
            fi;
            if [ "$found" -ne 0 ]; then
            echo "Could not reach download.docker.com" >&2;
            exit 1;
            fi;
            created=;
            if ! grep -qs '^[^#]*download\.docker\.com' /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; then
            key=/etc/apt/keyrings/docker.asc;
            list=/etc/apt/sources.list.d/docker.list;
            install -m 0755 -d /etc/apt/keyrings || exit 1;
            curl -fsSL "$repo/gpg" -o "$key" || exit 1;
            chmod a+r "$key";
            echo "deb [arch=$arch signed-by=$key] $repo $codename stable" > "$list";
            created="$list";
            fi;
            if ! apt-get update; then
            if [ -n "$created" ]; then rm -f "$created"; fi;
            exit 1;
            fi;
            exec apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        - ["sh", "-c", "{{installCompose}}"]
        - ["sh", "-c", "{{addSudoUserToDockerGroup}}"]
        - ["sh", "-c", "{{enableAndStartDocker}}"]
      dnf:
        # Rocky and Alma name rhel in ID_LIKE and use Docker's CentOS
        # repository; RHEL itself has its own.
        - - "sh"
          - "-c"
          - >-
            command -v docker >/dev/null 2>&1 && exit 0;
            . /etc/os-release;
            case " $ID ${ID_LIKE:-} " in
            *" amzn "*) exec dnf -y install docker ;;
            *" rhel "*|*" centos "*) repo=centos ;;
            *" fedora "*) repo=fedora ;;
            *) echo "Docker has no dnf repository for $ID" >&2; exit 1 ;;
            esac;
            if [ "$ID" = rhel ]; then
            repo=rhel;
            fi;
            created=;
            if ! grep -qs '^[^#]*download\.docker\.com' /etc/yum.repos.d/*.repo; then
            file=/etc/yum.repos.d/docker-ce.repo;
            curl -fsSL "https://download.docker.com/linux/$repo/docker-ce.repo" -o "$file" || { rm -f "$file"; exit 1; };
            created="$file";
            fi;
            if ! dnf -y makecache --repo docker-ce-stable; then
            if [ -n "$created" ]; then rm -f "$created"; fi;
            echo "Could not load Docker's $repo repository for this release" >&2;
            exit 1;
            fi;
            exec dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
        - ["sh", "-c", "{{installCompose}}"]
        - ["sh", "-c", "{{addSudoUserToDockerGroup}}"]
        - ["sh", "-c", "{{enableAndStartDocker}}"]
      yum:
        # Systems without dnf, such as Amazon Linux 2 and CentOS 7.
        - - "sh"
          - "-c"
          - >-
            command -v docker >/dev/null 2>&1 && exit 0;
            . /etc/os-release;
            if [ "$ID" = amzn ]; then
            yum -y install amazon-linux-extras || exit 1;
            exec amazon-linux-extras install -y docker;
            fi;
            created=;
            if ! grep -qs '^[^#]*download\.docker\.com' /etc/yum.repos.d/*.repo; then
            file=/etc/yum.repos.d/docker-ce.repo;
            curl -fsSL https://download.docker.com/linux/centos/docker-ce.repo -o "$file" || { rm -f "$file"; exit 1; };
            created="$file";
            fi;
            if ! yum -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin; then
            if [ -n "$created" ]; then rm -f "$created"; fi;
            exit 1;
            fi
        - ["sh", "-c", "{{installCompose}}"]
        - ["sh", "-c", "{{addSudoUserToDockerGroup}}"]
        - ["sh", "-c", "{{enableAndStartDocker}}"]
      pacman:
        - ["pacman", "-Syu", "--noconfirm", "docker", "docker-compose"]
        - ["sh", "-c", "{{addSudoUserToDockerGroup}}"]
        - ["sh", "-c", "{{enableAndStartDocker}}"]
      brew:
        - ["brew", "install", "--cask", "docker"]

  java:
    name: Java
    description: Java runtime
    defaultVersion: "25"
    commonVersions: ["8", "11", "17", "21", "25"]
    variables:
      correttoLinuxVersion:
        default: "{{version}}"
        versions:
          "8": "1.8.0"
      pacmanPackage:
        default: "jdk{{version}}-openjdk"
        versions:
          "25": jdk-openjdk
    versions:
      "8":
        name: Java 8
        description: Legacy LTS runtime for older Minecraft servers
        manualInstructions:
          darwin: "Install Java 8 with: brew install openjdk@8"
          linux: "Install Java 8 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-8-ug/downloads-list.html"
          windows: "Install Java 8 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-8-ug/downloads-list.html"
      "11":
        name: Java 11
        description: LTS runtime for older server software
        manualInstructions:
          darwin: "Install Java 11 with: brew install openjdk@11"
          linux: "Install Java 11 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-11-ug/downloads-list.html"
          windows: "Install Java 11 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-11-ug/downloads-list.html"
      "17":
        name: Java 17
        description: LTS runtime used by many modern Minecraft versions
        manualInstructions:
          darwin: "Install Java 17 with: brew install openjdk@17"
          linux: "Install Java 17 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-17-ug/downloads-list.html"
          windows: "Install Java 17 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-17-ug/downloads-list.html"
      "21":
        name: Java 21
        description: LTS runtime supported by modern Minecraft servers
        manualInstructions:
          darwin: "Install Java 21 with: brew install openjdk@21"
          linux: "Install Java 21 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-21-ug/downloads-list.html"
          windows: "Install Java 21 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-21-ug/downloads-list.html"
      "25":
        name: Java 25
        description: Latest runtime recommended for SimpleCloud serverhosts
        recommended: true
        manualInstructions:
          darwin: "Install Java 25 with: brew install openjdk@25"
          linux: "Install Java 25 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-25-ug/downloads-list.html"
          windows: "Install Java 25 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-25-ug/downloads-list.html"
    commands:
      apt:
        - ["apt-get", "update"]
        - ["apt-get", "install", "-y", "ca-certificates", "apt-transport-https", "gnupg", "wget"]
        - ["sh", "-c", "wget -O - https://apt.corretto.aws/corretto.key | gpg --yes --dearmor -o /usr/share/keyrings/corretto-keyring.gpg"]
        - ["sh", "-c", "echo \"deb [signed-by=/usr/share/keyrings/corretto-keyring.gpg] https://apt.corretto.aws stable main\" > /etc/apt/sources.list.d/corretto.list"]
        - ["apt-get", "update"]
        - ["apt-get", "install", "-y", "java-{{correttoLinuxVersion}}-amazon-corretto-jdk", "libxi6", "libxtst6", "libxrender1"]
      dnf:
        - ["rpm", "--import", "https://yum.corretto.aws/corretto.key"]
        - ["curl", "-Lo", "/etc/yum.repos.d/corretto.repo", "https://yum.corretto.aws/corretto.repo"]
        - ["dnf", "-y", "install", "java-{{correttoLinuxVersion}}-amazon-corretto-devel"]
      yum:
        - ["rpm", "--import", "https://yum.corretto.aws/corretto.key"]
        - ["curl", "-Lo", "/etc/yum.repos.d/corretto.repo", "https://yum.corretto.aws/corretto.repo"]
        - ["yum", "-y", "install", "java-{{correttoLinuxVersion}}-amazon-corretto-devel"]
      brew:
        - ["brew", "install", "openjdk@{{version}}"]
      pacman:
        - ["pacman", "-Syu", "{{pacmanPackage}}"]
      winget:
        - ["winget", "install", "--id", "Amazon.Corretto.{{version}}.JDK", "--source", "winget"]
      choco:
        - ["choco", "install", "corretto{{version}}jdk", "-y"]
      scoop:
        - ["scoop", "install", "java/corretto{{version}}-jdk"]

services:
  postgresql:
    name: PostgreSQL
    description: Relational database
    dependencies:
      - installable: docker
        checks:
          - ["docker", "compose", "version"]
          - ["docker", "info"]
    variables:
      image:
        default: "postgres:17-alpine"
        pattern: "^[A-Za-z0-9._/:@-]+$"
      port:
        default: "5432"
        increment: true
        minimum: 1
        maximum: 65535
        pattern: "^[0-9]{1,5}$"
      database:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      username:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      password:
        generate: password
        length: 48
        pattern: "^[A-Za-z0-9]+$"
    files:
      - source: services/postgresql/compose.yaml
        target: compose.yaml
      - source: services/postgresql/service.env
        target: .env
        mode: "0600"
      - source: services/postgresql/README.md
        target: README.md
    commands:
      start:
        - ["docker", "compose", "up", "-d", "--wait"]
      stop:
        - ["docker", "compose", "down"]
      status:
        - ["docker", "compose", "ps"]

  mariadb:
    name: MariaDB
    description: Relational database
    dependencies:
      - installable: docker
        checks:
          - ["docker", "compose", "version"]
          - ["docker", "info"]
    variables:
