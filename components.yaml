setup:
  components:
    - serverhost
    - default-templates
    - internal-workflows

components:
  serverhost:
    type: registry
    slug: serverhost
    name: serverhost
    filename: serverhost.jar
    description: Core runtime for managing Minecraft servers
    startConfig:
      javaArgs: ["-Xmx512m"]

  default-templates:
    type: direct
    version: "0.0.15"
    downloadUrl: "https://github.com/theSimpleCloud/simplecloud-manifest/releases/latest/download/default-templates.zip"
    name: default-templates
    extractPath: "templates/*"

  serverhost-defaults:
    type: direct
    version: "0.0.0"
    downloadUrl: "https://github.com/theSimpleCloud/simplecloud-manifest/releases/latest/download/serverhost-defaults.zip"
    name: serverhost-defaults
    extractPath: "/"
