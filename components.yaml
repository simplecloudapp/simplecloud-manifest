        increment: true
        minimum: 1
        maximum: 65535
        pattern: "^[0-9]{1,5}$"
      database:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      username:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      password:
        generate: password
        length: 48
        pattern: "^[A-Za-z0-9]+$"
      rootPassword:
        generate: password
        length: 48
        pattern: "^[A-Za-z0-9]+$"
    files:
      - source: services/mariadb/compose.yaml
        target: compose.yaml
      - source: services/mariadb/service.env
        target: .env
        mode: "0600"
      - source: services/mariadb/README.md
        target: README.md
    commands:
      start:
        - ["docker", "compose", "up", "-d", "--wait"]
      stop:
        - ["docker", "compose", "down"]
      status:
        - ["docker", "compose", "ps"]

  mongodb:
