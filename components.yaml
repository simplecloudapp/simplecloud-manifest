      database:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      username:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      password:
        generate: password
        length: 48
        pattern: "^[A-Za-z0-9]+$"
    files:
      - source: services/mongodb/compose.yaml
