setup:
  components:
    - serverhost
    - default-templates
    - serverhost-defaults

components:
  serverhost:
    type: registry
    slug: serverhost
    name: serverhost
    filename: serverhost.jar
    description: Core runtime for managing Minecraft servers
    startConfig:
      javaArgs: ["-Xmx512m"]

  default-templates:
    type: direct
    version: "0.0.15"
    downloadUrl: "https://github.com/simplecloudapp/simplecloud-manifest/releases/download/v0.0.15/default-templates.zip"
    name: default-templates
    extractPath: "templates/*"

  serverhost-defaults:
    type: direct
    version: "0.0.15"
    downloadUrl: "https://github.com/simplecloudapp/simplecloud-manifest/releases/download/v0.0.15/serverhost-defaults.zip"
    name: serverhost-defaults
    extractPath: "/"
