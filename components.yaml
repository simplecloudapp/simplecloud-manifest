setup:
  components:
    - serverhost
    - default-templates
    - serverhost-defaults

components:
  serverhost:
    type: registry
    slug: serverhost
    name: serverhost
    filename: serverhost.jar
    description: Core runtime for managing Minecraft servers
    startConfig:
      javaArgs: ["-Xmx512m"]

  default-templates:
    type: direct
    version: "0.0.46"
    downloadUrl: "https://github.com/simplecloudapp/simplecloud-manifest/releases/download/v0.0.46/default-templates.zip"
    name: default-templates
    extractPath: "/"

  serverhost-defaults:
    type: direct
    version: "0.0.50"
    downloadUrl: "https://github.com/simplecloudapp/simplecloud-manifest/releases/download/v0.0.50/serverhost-defaults.zip"
    name: serverhost-defaults
    extractPath: "/"

installables:
  docker:
    name: Docker
    description: Docker Engine and the Docker Compose plugin
    variables:
      composeVersion: "5.1.2"
    manualInstructions:
      darwin: "Install and start Docker Desktop from https://docs.docker.com/desktop/setup/install/mac-install/"
      linux: "Install Docker Engine and the Docker Compose plugin from https://docs.docker.com/engine/install/"
      windows: "Install and start Docker Desktop from https://docs.docker.com/desktop/setup/install/windows-install/"
    commands:
      apt:
        - ["apt-get", "update"]
        - ["apt-get", "install", "-y", "ca-certificates", "curl", "docker.io"]
        - ["install", "-m", "0755", "-d", "/usr/local/lib/docker/cli-plugins"]
        - ["sh", "-c", "arch=\"$(uname -m)\"; case \"$arch\" in x86_64|aarch64) ;; armv7l) arch=armv7 ;; *) echo \"Unsupported Docker Compose architecture: $arch\" >&2; exit 1 ;; esac; curl -fL \"https://github.com/docker/compose/releases/download/v{{composeVersion}}/docker-compose-linux-$arch\" -o /usr/local/lib/docker/cli-plugins/docker-compose"]
        - ["chmod", "+x", "/usr/local/lib/docker/cli-plugins/docker-compose"]
        - ["sh", "-c", "if command -v systemctl >/dev/null 2>&1; then systemctl enable --now docker; else service docker start; fi"]
      dnf:
        - ["dnf", "-y", "install", "dnf-plugins-core"]
        - ["sh", "-c", "dnf config-manager addrepo --from-repofile https://download.docker.com/linux/fedora/docker-ce.repo || dnf config-manager --add-repo https://download.docker.com/linux/fedora/docker-ce.repo"]
        - ["dnf", "-y", "install", "docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]
        - ["systemctl", "enable", "--now", "docker"]
      yum:
        - ["yum", "-y", "install", "curl", "docker"]
        - ["install", "-m", "0755", "-d", "/usr/local/lib/docker/cli-plugins"]
        - ["sh", "-c", "arch=\"$(uname -m)\"; case \"$arch\" in x86_64|aarch64) ;; armv7l) arch=armv7 ;; *) echo \"Unsupported Docker Compose architecture: $arch\" >&2; exit 1 ;; esac; curl -fL \"https://github.com/docker/compose/releases/download/v{{composeVersion}}/docker-compose-linux-$arch\" -o /usr/local/lib/docker/cli-plugins/docker-compose"]
        - ["chmod", "+x", "/usr/local/lib/docker/cli-plugins/docker-compose"]
        - ["sh", "-c", "if command -v systemctl >/dev/null 2>&1; then systemctl enable --now docker; else service docker start; fi"]
      pacman:
        - ["pacman", "-Syu", "--noconfirm", "docker", "docker-compose"]
        - ["systemctl", "enable", "--now", "docker"]
      brew:
        - ["brew", "install", "--cask", "docker"]

  java:
    name: Java
    description: Java runtime
    defaultVersion: "25"
    commonVersions: ["8", "11", "17", "21", "25"]
    variables:
      correttoLinuxVersion:
        default: "{{version}}"
        versions:
          "8": "1.8.0"
      pacmanPackage:
        default: "jdk{{version}}-openjdk"
        versions:
          "25": jdk-openjdk
    versions:
      "8":
        name: Java 8
        description: Legacy LTS runtime for older Minecraft servers
        manualInstructions:
          darwin: "Install Java 8 with: brew install openjdk@8"
          linux: "Install Java 8 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-8-ug/downloads-list.html"
          windows: "Install Java 8 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-8-ug/downloads-list.html"
      "11":
        name: Java 11
        description: LTS runtime for older server software
        manualInstructions:
          darwin: "Install Java 11 with: brew install openjdk@11"
          linux: "Install Java 11 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-11-ug/downloads-list.html"
          windows: "Install Java 11 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-11-ug/downloads-list.html"
      "17":
        name: Java 17
        description: LTS runtime used by many modern Minecraft versions
        manualInstructions:
          darwin: "Install Java 17 with: brew install openjdk@17"
          linux: "Install Java 17 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-17-ug/downloads-list.html"
          windows: "Install Java 17 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-17-ug/downloads-list.html"
      "21":
        name: Java 21
        description: LTS runtime supported by modern Minecraft servers
        manualInstructions:
          darwin: "Install Java 21 with: brew install openjdk@21"
          linux: "Install Java 21 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-21-ug/downloads-list.html"
          windows: "Install Java 21 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-21-ug/downloads-list.html"
      "25":
        name: Java 25
        description: Latest runtime recommended for SimpleCloud serverhosts
        recommended: true
        manualInstructions:
          darwin: "Install Java 25 with: brew install openjdk@25"
          linux: "Install Java 25 with your package manager or from https://docs.aws.amazon.com/corretto/latest/corretto-25-ug/downloads-list.html"
          windows: "Install Java 25 with winget, Chocolatey, Scoop, or download it from https://docs.aws.amazon.com/corretto/latest/corretto-25-ug/downloads-list.html"
    commands:
      apt:
        - ["apt-get", "update"]
        - ["apt-get", "install", "-y", "ca-certificates", "apt-transport-https", "gnupg", "wget"]
        - ["sh", "-c", "wget -O - https://apt.corretto.aws/corretto.key | gpg --yes --dearmor -o /usr/share/keyrings/corretto-keyring.gpg"]
        - ["sh", "-c", "echo \"deb [signed-by=/usr/share/keyrings/corretto-keyring.gpg] https://apt.corretto.aws stable main\" > /etc/apt/sources.list.d/corretto.list"]
        - ["apt-get", "update"]
        - ["apt-get", "install", "-y", "java-{{correttoLinuxVersion}}-amazon-corretto-jdk", "libxi6", "libxtst6", "libxrender1"]
      dnf:
        - ["rpm", "--import", "https://yum.corretto.aws/corretto.key"]
        - ["curl", "-Lo", "/etc/yum.repos.d/corretto.repo", "https://yum.corretto.aws/corretto.repo"]
        - ["dnf", "-y", "install", "java-{{correttoLinuxVersion}}-amazon-corretto-devel"]
      yum:
        - ["rpm", "--import", "https://yum.corretto.aws/corretto.key"]
        - ["curl", "-Lo", "/etc/yum.repos.d/corretto.repo", "https://yum.corretto.aws/corretto.repo"]
        - ["yum", "-y", "install", "java-{{correttoLinuxVersion}}-amazon-corretto-devel"]
      brew:
        - ["brew", "install", "openjdk@{{version}}"]
      pacman:
        - ["pacman", "-Syu", "{{pacmanPackage}}"]
      winget:
        - ["winget", "install", "--id", "Amazon.Corretto.{{version}}.JDK", "--source", "winget"]
      choco:
        - ["choco", "install", "corretto{{version}}jdk", "-y"]
      scoop:
        - ["scoop", "install", "java/corretto{{version}}-jdk"]

services:
  postgresql:
    name: PostgreSQL
    description: Relational database
    dependencies:
      - installable: docker
        checks:
          - ["docker", "compose", "version"]
          - ["docker", "info"]
    variables:
      image:
        default: "postgres:17-alpine"
        pattern: "^[A-Za-z0-9._/:@-]+$"
      port:
        default: "5432"
        increment: true
        minimum: 1
        maximum: 65535
        pattern: "^[0-9]{1,5}$"
      database:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      username:
        default: simplecloud
        pattern: "^[A-Za-z0-9_-]+$"
      password:
        generate: password
        length: 48
        pattern: "^[A-Za-z0-9]+$"
    files:
      - source: services/postgresql/compose.yaml
        target: compose.yaml
      - source: services/postgresql/service.env
        target: .env
        mode: "0600"
      - source: services/postgresql/README.md
        target: README.md
    commands:
      start:
        - ["docker", "compose", "up", "-d", "--wait"]
      stop:
        - ["docker", "compose", "down"]
      status:
        - ["docker", "compose", "ps"]

  mariadb:
    name: MariaDB
    description: Relational database
    dependencies:
      - installable: docker
        checks:
          - ["docker", "compose", "version"]
          - ["docker", "info"]
    variables:
