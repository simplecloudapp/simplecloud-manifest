name: Sync manifest to released components

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Sync released component versions and download URLs
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REFERENCE_ASSETS: ${{ toJson(github.event.release.assets) }}
          REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.release.target_commitish }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          python - "$VERSION" "$REPOSITORY" "$RELEASE_TAG" "$REFERENCE_ASSETS" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1]
          repository = sys.argv[2]
          release_tag = sys.argv[3]
          assets_json = sys.argv[4]

          try:
            release_assets = json.loads(assets_json)
          except json.JSONDecodeError as error:
            raise SystemExit(f"Failed to decode GitHub assets JSON: {error}")

          released_components = {
            asset["name"][:-4]
            for asset in release_assets
            if isinstance(asset, dict)
            and asset.get("name", "").endswith(".zip")
          }

          if not released_components:
            print("No .zip assets found in this release.")
            exit(0)

          path = Path("components.yaml")
          lines = path.read_text().splitlines()
          output = []

          in_components_section = False
          in_component_block = False
          current_component = None
          updated_components = {}

          def flush_component_footer():
            if not in_component_block or current_component not in updated_components:
              return
            if not updated_components[current_component]["version"]:
              output.append(f'    version: "{version}"')
            if not updated_components[current_component]["downloadUrl"]:
              output.append(
                f'    downloadUrl: "https://github.com/{repository}/releases/download/{release_tag}/{current_component}.zip"'
              )

          for raw_line in lines:
            if raw_line == "components:":
              in_components_section = True
              output.append(raw_line)
              continue

            if in_components_section and raw_line and not raw_line.startswith(" "):
              flush_component_footer()
              in_component_block = False
              current_component = None
              output.append(raw_line)
              continue

            if in_components_section and raw_line.startswith("  ") and not raw_line.startswith("    "):
              flush_component_footer()
              in_component_block = False
              current_component = None

              component_name = raw_line.split(":", 1)[0].strip()
              in_component_block = component_name in released_components
              if in_component_block:
                current_component = component_name
                updated_components[current_component] = {
                  "version": False,
                  "downloadUrl": False,
                }
              output.append(raw_line)
              continue

            if not in_component_block:
              output.append(raw_line)
              continue

            stripped = raw_line.strip()
            if stripped.startswith("version:"):
              output.append(f'    version: "{version}"')
              updated_components[current_component]["version"] = True
              continue

            if stripped.startswith("downloadUrl:"):
              output.append(
                f'    downloadUrl: "https://github.com/{repository}/releases/download/{release_tag}/{current_component}.zip"'
              )
              updated_components[current_component]["downloadUrl"] = True
              continue

            output.append(raw_line)

          flush_component_footer()

          if not updated_components:
            print("No matching component zip files found in components.yaml.")
            exit(0)

          path.write_text("\n".join(output) + "\n")
          PY

          if git diff --quiet -- components.yaml; then
            echo "components.yaml already matches release ${VERSION}."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components.yaml
          git commit -m "chore(components): sync release components for v${VERSION}"
          git push origin HEAD:${BASE_REF}
