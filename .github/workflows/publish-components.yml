name: Publish component release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  publish-components:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "${{ github.event.inputs.tag }}" ]; then
              echo "workflow_dispatch requires a tag input."
              exit 1
            fi
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package component folders
        id: changed
        shell: bash
        run: |
          if [ ! -d "components" ]; then
            echo "Missing components folder."
            exit 1
          fi

          TAG="${{ steps.release.outputs.tag }}"
          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_EXISTS=true
          fi

          SEMVER_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ "$TAG" =~ $SEMVER_PATTERN ]]; then
            SEMVER_TAGS="$(git tag -l 'v*' | grep -E "$SEMVER_PATTERN" || true)"
            if [ "$TAG_EXISTS" = true ]; then
              PREVIOUS_TAG="$(
                printf '%s\n' "$SEMVER_TAGS" \
                  | sort -V \
                  | awk -v tag="$TAG" '
                      $0 == tag { print prev; found=1; exit }
                      { prev=$0 }
                      END { if (!found) print "" }
                    '
              )"
            else
              PREVIOUS_TAG="$(
                printf '%s\n' "$SEMVER_TAGS" \
                  | sort -V \
                  | awk -v tag="$TAG" '$0 < tag { prev=$0 } END { print prev }'
              )"
              echo "Tag ${TAG} does not exist yet. Comparing from ${PREVIOUS_TAG:-<none>} to current HEAD."
            fi
          else
            echo "Tag ${TAG} is not strict semver (vX.Y.Z). Including all components."
            PREVIOUS_TAG=""
          fi

          if [ "$TAG_EXISTS" = true ]; then
            COMPARE_REF="$TAG"
          else
            COMPARE_REF="HEAD"
          fi

          mkdir -p .tmp/dist .tmp/stage
          : > .tmp/changed-components.txt

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found. Including all components."
            candidate_components="$(find components -mindepth 1 -maxdepth 1 -type d -exec basename {} \;)"
          else
            echo "Comparing changed components from ${PREVIOUS_TAG} to ${COMPARE_REF}."
            candidate_components="$(
              git diff --name-only "$PREVIOUS_TAG" "$COMPARE_REF" -- components \
                | awk -F/ '/^components\/[^/]+\// { print $2 }' \
                | sort -u
            )"
          fi

          for component_name in $candidate_components; do
            if [[ "$component_name" == .* ]]; then
              continue
            fi
            if [ ! -d "components/$component_name" ]; then
              continue
            fi

            has_payload_file=0
            if find "components/$component_name" -type f -not -name ".gitkeep" -not -name ".DS_Store" | grep -q "."; then
              has_payload_file=1
            fi

            if [ "$has_payload_file" -eq 0 ]; then
              echo "Skipping $component_name (no files to package)."
              continue
            fi

            echo "$component_name" >> .tmp/changed-components.txt
          done

          if [ ! -s .tmp/changed-components.txt ]; then
            echo "No changed component payloads found for this tag."
            echo "has_components=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed components:"
          cat .tmp/changed-components.txt
          while IFS= read -r component_name; do
            stage_dir=".tmp/stage/${component_name}"
            history_file=".tmp/stage/${component_name}.history.txt"
            rm -rf "$stage_dir"
            mkdir -p "$stage_dir"

            rsync -a \
              --exclude ".git*" \
              --exclude ".DS_Store" \
              --exclude ".gitkeep" \
              "components/$component_name/" \
              "$stage_dir/"

            git log --pretty=format: --name-only -- "components/$component_name" \
              | sed '/^$/d' \
              | sed "s#^components/$component_name/##" \
              | grep -Ev '^(\.gitkeep|\.DS_Store)$' \
              | sort -u > "$history_file"

            python3 - "$stage_dir" "$component_name" "$TAG" "$history_file" <<'PY'
            import hashlib
            import json
            import sys
            from pathlib import Path

            root = Path(sys.argv[1])
            component = sys.argv[2]
            release_tag = sys.argv[3]
            history_file = Path(sys.argv[4])
            version = release_tag[1:] if release_tag.startswith("v") else release_tag

            files = []
            current_paths = set()
            for path in sorted(root.rglob("*")):
                if not path.is_file():
                    continue
                rel = path.relative_to(root).as_posix()
                if rel == "manifest.json":
                    continue
                sha256 = hashlib.sha256(path.read_bytes()).hexdigest()
                files.append({"path": rel, "sha256": sha256})
                current_paths.add(rel)

            historic_paths = set()
            if history_file.exists():
                for raw in history_file.read_text().splitlines():
                    rel = raw.strip().replace("\\", "/")
                    if not rel or rel == "manifest.json":
                        continue
                    historic_paths.add(rel)

            deleted_files = sorted(historic_paths - current_paths)

            manifest = {
                "component": component,
                "version": version,
                "releaseTag": release_tag,
                "fileCount": len(files),
                "files": files,
                "deletedFiles": deleted_files,
            }

            (root / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
            PY

            (cd "$stage_dir" && zip -r "../../dist/${component_name}.zip" .)
          done < .tmp/changed-components.txt
          echo "has_components=true" >> "$GITHUB_OUTPUT"

      - name: Create release assets for components
        if: steps.changed.outputs.has_components == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: .tmp/dist/*.zip
          fail_on_unmatched_files: true

      - name: Trigger component manifest sync
        if: steps.changed.outputs.has_components == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/workflows/sync-components-manifest.yml/dispatches \
            --method POST \
            -f ref="${{ github.event.repository.default_branch }}" \
            -f inputs[tag]="${{ steps.release.outputs.tag }}"
